<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VSCLMS{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark px-3 flex-wrap">
  <a class="navbar-brand" href="{% url 'dashboard' %}">VSCLMS</a>
  {% if user.is_authenticated %}
    {% if is_administrator %}
    <ul class="navbar-nav me-auto flex-wrap">
      <li class="nav-item">
        <a class="nav-link {% if 'designation' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'designation_list' %}">Designations</a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if 'leave_type' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'leave_type_list' %}">Leave types</a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if 'department' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'department_list' %}">Departments</a>
      </li>
    </ul>
    {% else %}
    <div class="me-auto"></div>
    {% endif %}
    <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-3 mb-0">
      {% csrf_token %}
      <span class="text-light small">{{ user.get_username }}</span>
      <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
    </form>
  {% endif %}
</nav>
<main class="container py-4">
  {% for m in messages %}
    <div class="alert alert-{{ m.tags|default:'info' }}" role="alert">{{ m }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
