<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VSCLMS{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="{% url 'dashboard' %}">VSCLMS</a>
  {% if user.is_authenticated %}
  <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-3 mb-0">
    {% csrf_token %}
    <span class="text-light small">{{ user.get_username }}</span>
    <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
  </form>
  {% endif %}
</nav>
<main class="container py-4">
  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
